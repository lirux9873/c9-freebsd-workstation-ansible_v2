---
- name: Bootstrap Ansible collection dependencies
  hosts: localhost
  connection: local
  gather_facts: false
  become: true

  tasks:
    - name: Install Ansible collections from requirements
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - install
          - --requirements-file
          - "{{ playbook_dir }}/requirements.yml"
          - --collections-path
          - "{{ playbook_dir }}/collections"
      register: galaxy_install_result
      changed_when: >-
        'Nothing to do' not in galaxy_install_result.stdout
        and
        'All requested collections are already installed'
        not in galaxy_install_result.stdout

- name: Configure FreeBSD Sway workstation
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/profile_sway.yml

  roles:
    - c9.freebsd_workstation.common_validation
    - c9.freebsd_workstation.common_packages
    - c9.freebsd_workstation.common_users
    - c9.freebsd_workstation.common_sudo
    - c9.freebsd_workstation.common_localization
    - c9.freebsd_workstation.common_fonts
    - c9.freebsd_workstation.service_dbus
    - c9.freebsd_workstation.service_seatd
    - c9.freebsd_workstation.service_ntpsec
    - c9.freebsd_workstation.networking_base
    - c9.freebsd_workstation.security_base
    - c9.freebsd_workstation.desktop_common
    - c9.freebsd_workstation.desktop_wayland
    - c9.freebsd_workstation.desktop_sway
    - c9.freebsd_workstation.validation_workstation
