---
- name: Install finalized Suckless applications
  ansible.builtin.command:
    argv: "{{ [suckless_flexipatch_make_command, 'install'] + (item.install_args | default([])) }}"
    chdir: "{{ item.final }}"
  environment: "{{ suckless_flexipatch_make_environment }}"
  loop: "{{ flexipatch_items }}"
  loop_control:
    label: "{{ item.name }}: gmake install"
  when: item.enabled | default(true) | bool
  changed_when: true
